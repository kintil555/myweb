<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Voxel/Clion</title>
  <!-- preload font paling penting aja -->
  <link rel="preload" href="fonts/Minecraft-Seven.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="fonts/NotoSans-Bold-subset.ttf" as="font" type="font/truetype" crossorigin>
  <link href="stylesheet/public_style.css" rel="stylesheet">
  <link href="stylesheet/oreui.css" rel="stylesheet">
  <style>
    /* font-display swap biar teks muncul duluan sebelum font kelar download */
    @font-face { font-family: "Minecraft Seven"; src: url("fonts/Minecraft-Seven.otf"); font-display: swap; }
    @font-face { font-family: "Minecraft Ten"; src: url("fonts/Minecraft-Ten.otf"); font-display: swap; }
    @font-face { font-family: "NotoSans Bold"; src: url("fonts/NotoSans-Bold-subset.ttf"); font-display: swap; }

    .karya-img-wrap {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid #58585A;
      display: block;
    }

    .karya-img-wrap img {
      width: 100%;
      display: block;
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .karya-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s ease;
      pointer-events: none;
    }

    .karya-overlay a,
    .karya-overlay button {
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: all;
      text-decoration: none;
    }

    .karya-img-wrap:hover img {
      transform: scale(1.04);
      filter: brightness(0.5);
    }

    .karya-img-wrap:hover .karya-overlay {
      background: rgba(0,0,0,0.3);
    }

    .karya-img-wrap:hover .karya-overlay a,
    .karya-img-wrap:hover .karya-overlay button {
      opacity: 1;
      transform: scale(1);
    }

    .karya-img-wrap.pressed img {
      transform: scale(1.04);
      filter: brightness(0.5);
    }

    .karya-img-wrap.pressed .karya-overlay {
      background: rgba(0,0,0,0.3);
    }

    .karya-img-wrap.pressed .karya-overlay a,
    .karya-img-wrap.pressed .karya-overlay button {
      opacity: 1;
      transform: scale(1);
    }

    .karya-caption {
      font-family: "NotoSans Bold", sans-serif;
      font-size: 13px;
      color: #D0D1D4;
      padding: 6px 10px;
      background-color: #313233;
      border-top: 2px solid #58585A;
    }

    .karya-item {
      margin: 6px 20px;
    }

    .medsos-btn {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .skills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      justify-content: center;
      padding: 8px 20px;
    }

    /* skill link-block override biar dark */
    .skills-row link-block {
      background-color: #3A3B3C;
      border: 2px solid #58585A;
      box-shadow: inset 0 -3px #2A2B2C, inset 2px 2px rgba(255,255,255,0.08);
      color: #FFFFFF;
      min-height: 44px;
    }

    .skills-row link-block:hover,
    .skills-row link-block:active {
      background-color: #4E4F50;
      border-color: #8C8D90;
    }

    .skills-row .link_title_text {
      color: #FFFFFF;
    }

    /* side drawer for medsos */
    #drawer-overlay {
      background-color: rgba(0,0,0,0.7);
      bottom: 0; left: 0; right: 0; top: 0;
      display: none;
      position: fixed;
      z-index: 11;
    }

    #drawer-overlay.open { display: block; }

    #medsos-drawer {
      background-color: #313233;
      border-right: 2px solid #1E1E1F;
      box-shadow: inset -2px 0 #58585A;
      bottom: 0; left: 0; top: 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      width: 200px;
      z-index: 12;
    }

    #medsos-drawer.open { transform: translateX(0); }

    /* fix header left item clipping */
    .header_item_left {
      width: 50px !important;
    }
    #menu-btn {
      width: 50px !important;
      padding: 0 10px !important;
    }

    #drawer-title {
      align-items: center;
      background-color: #48494A;
      box-shadow: inset 2px 2px rgba(255,255,255,0.2), inset -2px -2px rgba(255,255,255,0.1);
      border-bottom: 4px solid #1E1E1F;
      color: #fff;
      display: flex;
      font-family: "Minecraft Seven", sans-serif;
      font-size: 18px;
      height: 44px;
      justify-content: center;
    }

    #drawer-links {
      padding: 10px 0;
      flex: 1;
    }

    #drawer-links a {
      align-items: center;
      border-bottom: 2px solid #1E1E1F;
      border-top: 2px solid #5A5B5C;
      box-shadow: none;
      color: #fff;
      display: flex;
      font-family: "NotoSans Bold", sans-serif;
      font-size: 15px;
      gap: 10px;
      padding: 12px 20px;
      text-decoration: none;
      transition: background 0.1s;
    }

    #drawer-links a:hover {
      background-color: #48494A;
    }

    #drawer-links a:active {
      background-color: #58585A;
    }

    /* hamburger btn */
    #menu-btn {
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      height: 100%;
      justify-content: center;
      padding: 0 8px;
      width: 42px;
    }

    #menu-btn .menu-line {
      background: #333 !important;
      border: none !important;
      display: block !important;
      height: 3px !important;
      width: 20px !important;
    }

    .footer_info {
      align-items: center;
      color: #FFFFFF;
      display: flex;
      font-family: "Minecraft Seven", sans-serif;
      font-size: 16px;
      height: 60px;
      justify-content: center;
      text-align: center;
      border-top: 2px solid #5A5B5C;
    }

    /* ---- LIGHTBOX ---- */
    #lightbox {
      align-items: center;
      background: rgba(0,0,0,0.92);
      bottom: 0; left: 0; right: 0; top: 0;
      display: none;
      justify-content: center;
      position: fixed;
      z-index: 50;
      padding: 16px;
    }

    #lightbox.open { display: flex; flex-direction: column; }

    #lightbox img {
      border: 2px solid #58585A;
      box-shadow: inset 2px 2px rgba(255,255,255,0.1);
      max-height: 80vh;
      max-width: 100%;
      object-fit: contain;
    }

    #lightbox-caption {
      color: #D0D1D4;
      font-family: "NotoSans Bold", sans-serif;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }

    #lightbox-close {
      position: absolute;
      top: 10px; right: 14px;
      background: #48494A;
      border: 2px solid #1E1E1F;
      box-shadow: inset 0 -3px #333334, inset 2px 2px rgba(255,255,255,0.2);
      color: #fff;
      cursor: pointer;
      font-family: "NotoSans Bold", sans-serif;
      font-size: 16px;
      height: 34px;
      width: 34px;
      display: flex; align-items: center; justify-content: center;
    }

    #lightbox-close:hover { background: #58585A; }
    #lightbox-close:active { background: #333334; box-shadow: none; padding-top: 3px; }

    #lightbox-loading {
      color: #D0D1D4;
      font-family: "Minecraft Seven", sans-serif;
      font-size: 16px;
      position: absolute;
    }

    /* ---- KARYA COLLAPSE ---- */
    .karya-toggle {
      align-items: center;
      cursor: pointer;
      display: flex;
      font-family: "Minecraft Seven", sans-serif;
      font-size: 18px;
      justify-content: center;
      gap: 10px;
      padding: 4px 0;
      user-select: none;
      width: 100%;
    }

    .karya-toggle:hover { color: #6CC349; }

    .karya-arrow {
      display: inline-block;
      transition: transform 0.25s ease;
      image-rendering: pixelated;
    }

    .karya-arrow.open { transform: rotate(90deg); }

    #karya-list {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.35s ease, opacity 0.3s ease;
      opacity: 0;
    }

    #karya-list > .karya-inner {
      overflow: hidden;
    }

    #karya-list.open {
      grid-template-rows: 1fr;
      opacity: 1;
    }
    /* ── Discord Server Slots (OreUI Minecraft inventory style) ── */
    #discord-server-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      padding: 4px 8px 8px;
    }

    .discord-slot {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      background-color: #3A3B3C;
      border-top: 2px solid #58585A;
      border-left: 2px solid #58585A;
      border-right: 2px solid #1D1D1E;
      border-bottom: 2px solid #1D1D1E;
      box-shadow: inset 2px 2px 0 rgba(255,255,255,0.06), inset -2px -2px 0 rgba(0,0,0,0.3);
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.1s, filter 0.1s;
      image-rendering: pixelated;
    }

    .discord-slot:hover {
      background-color: #575859;
      border-top-color: #8B8C8F;
      border-left-color: #8B8C8F;
      filter: brightness(1.1);
    }

    .discord-slot:active {
      background-color: #2E2F30;
      border-top-color: #1D1D1E;
      border-left-color: #1D1D1E;
      border-right-color: #58585A;
      border-bottom-color: #58585A;
      filter: brightness(0.85);
    }

    .discord-slot img {
      width: 40px;
      height: 40px;
      border-radius: 3px;
      object-fit: cover;
      image-rendering: auto;
      pointer-events: none;
    }

    /* Tooltip */
    .discord-slot .ds-tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background-color: #1F1F1F;
      border: 1px solid #5A2D6E;
      box-shadow: 2px 2px 0 #000, inset 1px 1px 0 rgba(255,255,255,0.05);
      color: #FFFFFF;
      font-family: 'Minecraft Seven', sans-serif;
      font-size: 10px;
      white-space: nowrap;
      padding: 4px 7px;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.12s;
      z-index: 20;
    }

    .discord-slot .ds-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: #5A2D6E;
    }

    .discord-slot:hover .ds-tooltip {
      opacity: 1;
      visibility: visible;
    }

  </style>
</head>

<script>
  // override sound paths biar jalan tanpa server
  const _basePath = (function() {

    return p.substring(0, p.lastIndexOf('/'));
  })();
  Object.assign(soundPaths, {

    open:   _basePath + '/sounds/drawer_open.ogg',

<script>
  // isi dari config
  document.getElementById('header-nama').textContent = CONFIG.nama;
  document.getElementById('hero-nama').textContent = CONFIG.nama;

  // Mini markdown parser buat bio: heading #/##/###, link [teks](url), newline
  function parseBioMarkdown(text) {
    // Fix literal \n yang ditulis di string config
    text = text.replace(/\\n/g, '\n');

    function makeImg(src, isExternal) {
      var url = isExternal ? src : ('media/' + src);
      var fname = src.split('/').pop();
      return '<img src="' + url + '" alt="' + fname + '" '
        + 'style="max-width:160px;max-height:160px;width:auto;height:auto;object-fit:contain;display:block;image-rendering:pixelated;" '
        + 'onerror="this.style.outline=\'2px solid #C33636\';this.alt=\'\u26a0 ' + fname + '\'">';
    }

    return text
      .split('\n')
      .map(function(line) {
        // Heading ###
        if (/^### (.+)/.test(line)) return '<div style="font-family:\'Minecraft Seven\',sans-serif;font-size:13px;color:#fff;margin:6px 0 2px;">' + line.replace(/^### /, '') + '</div>';
        // Heading ##
        if (/^## (.+)/.test(line)) return '<div style="font-family:\'Minecraft Seven\',sans-serif;font-size:16px;color:#fff;margin:8px 0 2px;">' + line.replace(/^## /, '') + '</div>';
        // Heading #
        if (/^# (.+)/.test(line)) return '<div style="font-family:\'Minecraft Seven\',sans-serif;font-size:20px;color:#fff;margin:10px 0 4px;">' + line.replace(/^# /, '') + '</div>';

        // Gambar side-by-side: @[img1.png, img2.png] atau @[url1, url2]
        var sbsMatch = line.match(/^@\[(.+)\]$/);
        if (sbsMatch) {
          // Split by ' , ' atau ',' tapi jaga URL — pisah by spasi setelah koma
          var raw = sbsMatch[1];
          var parts = [];
          var buf = '', depth = 0;
          for (var ci = 0; ci < raw.length; ci++) {
            var ch = raw[ci];
            if (ch === '(' ) depth++;
            if (ch === ')' ) depth--;
            if (ch === ',' && depth === 0) { parts.push(buf.trim()); buf = ''; }
            else buf += ch;
          }
          if (buf.trim()) parts.push(buf.trim());
          var imgs = parts.map(function(p) {
            return makeImg(p, /^https?:\/\//.test(p));
          }).join('');
          return '<div style="display:flex;gap:6px;margin:8px 0;justify-content:center;">' + imgs + '</div>';
        }

        // Gambar lokal single: @nama.ext
        line = line.replace(/@([\w.\-]+\.(png|jpg|jpeg|gif|webp))/gi, function(_, fname) {
          return '<div style="margin:8px 0;display:flex;justify-content:center;">' + makeImg(fname, false) + '</div>';
        });
        // Gambar eksternal: ![alt](url)
        line = line.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(_, alt, url) {
          return '<div style="margin:8px 0;display:flex;justify-content:center;">' + makeImg(url, true) + '</div>';
        });
        // Link [teks](url)
        line = line.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" onclick="playSound(\'click\')" style="color:#5B9BD5;text-decoration:underline;text-underline-offset:2px;">$1</a>');
        // Bold **teks**
        line = line.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        return line ? '<div style="margin:2px 0;">' + line + '</div>' : '<div style="height:8px;"></div>';
      })
      .join('');
  }

  document.getElementById('hero-bio').innerHTML = parseBioMarkdown(CONFIG.bio);
  document.getElementById('footer').innerHTML = '&copy; ' + CONFIG.copyright;

  // Apply terjemahan ke elemen statis
  document.getElementById('drawer-title').textContent     = T.sosialMedia;
  document.getElementById('lightbox-loading').textContent = T.memuatGambar;
  var el;
  el = document.getElementById('i18n-karya');         if (el) el.textContent = T.karya;
  el = document.getElementById('i18n-skill');         if (el) el.textContent = T.skill;
  el = document.getElementById('i18n-kontak');        if (el) el.textContent = T.kontak;
  el = document.getElementById('i18n-discordServer'); if (el) el.textContent = T.discordServer;

  // discord servers – OreUI inventory slot style
  var serverList = document.getElementById('discord-server-list');
  if (serverList && CONFIG.discordServers) {
    CONFIG.discordServers.forEach(function(s) {
      var slot = document.createElement('a');
      slot.href = s.url;
      slot.target = '_blank';
      slot.className = 'discord-slot';
      slot.setAttribute('aria-label', s.name);
      slot.onclick = function(){ playSound('click'); };

      var img = document.createElement('img');
      img.src = s.icon;
      img.alt = s.name;

      var tooltip = document.createElement('span');
      tooltip.className = 'ds-tooltip';
      tooltip.textContent = s.name;

      slot.appendChild(img);
      slot.appendChild(tooltip);
      serverList.appendChild(slot);
    });
  }

  // karya
  const karyaList = document.getElementById('karya-list');
  const karyaInner = document.createElement('div');
  karyaInner.className = 'karya-inner';
  karyaList.appendChild(karyaInner);
  CONFIG.karya.forEach(function(k, i) {
    karyaInner.innerHTML +=
      '<div class="karya-item">' +
        '<div class="karya-img-wrap" onclick="playSound(&quot;button&quot;); openLightbox(&quot;' + k.hd + '&quot;, &quot;' + k.judul + '&quot;)">' +
          '<img src="' + k.preview + '" alt="' + k.judul + '">' +
          '<div class="karya-overlay">' +
            '<button class="btn green_btn extra_small_btn">' + T.view + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="karya-caption">' + k.judul + '</div>' +
      '</div>';
  });

  // skills
  const skillList = document.getElementById('skill-list');
  CONFIG.skills.forEach(function(s) {
    skillList.innerHTML +=
      '<link-block style="width:160px; margin:6px;">' +
        '<div class="link_title"><span class="link_title_text">' + s + '</span></div>' +
      '</link-block>';
  });

  // drawer medsos
  const drawerLinks = document.getElementById('drawer-links');
  CONFIG.medsos.forEach(function(m) {
    drawerLinks.innerHTML +=
      '<a href="' + m.url + '" target="_blank">' +
        '<span style="display:flex;align-items:center;width:24px;height:24px;flex-shrink:0;">' + m.icon + '</span>' +
        m.label +
      '</a>';
  });

  // drawer functions
  function openDrawer() {
    document.getElementById('medsos-drawer').classList.add('open');
    document.getElementById('drawer-overlay').classList.add('open');
  }

  function closeDrawer() {
    document.getElementById('medsos-drawer').classList.remove('open');
    document.getElementById('drawer-overlay').classList.remove('open');
  }

  // hover via JS (bukan CSS hover biar ga bug pas scroll)
  document.addEventListener('mouseover', function(e) {
    var wrap = e.target.closest('.karya-img-wrap');
    if (wrap) wrap.classList.add('hovered');
  });
  document.addEventListener('mouseout', function(e) {
    var wrap = e.target.closest('.karya-img-wrap');
    if (wrap) wrap.classList.remove('hovered');
  });

  // touch support karya
  document.addEventListener('touchstart', function(e) {
    var wrap = e.target.closest('.karya-img-wrap');
    document.querySelectorAll('.karya-img-wrap').forEach(el => el.classList.remove('pressed'));
    if (wrap) wrap.classList.add('pressed');
  });

  document.addEventListener('touchend', function(e) {
    setTimeout(function() {
      if (!e.target.closest('.karya-overlay')) {
        document.querySelectorAll('.karya-img-wrap').forEach(el => el.classList.remove('pressed'));
      }
    }, 900);
  });

  // lightbox
  function openLightbox(hdSrc, caption) {
    const lb = document.getElementById('lightbox');
    const img = document.getElementById('lightbox-img');
    const loading = document.getElementById('lightbox-loading');
    const cap = document.getElementById('lightbox-caption');

    img.style.display = 'none';
    loading.style.display = 'block';
    cap.textContent = caption;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';

    const newImg = new Image();
    newImg.onload = function() {
      img.src = hdSrc;
      img.style.display = 'block';
      loading.style.display = 'none';
    };
    newImg.src = hdSrc;
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  function closeLightboxOutside(e) {
    if (e.target === document.getElementById('lightbox')) closeLightbox();
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLightbox();
  });

  // karya collapse
  function toggleKarya() {
    const list = document.getElementById('karya-list');
    const arrow = document.getElementById('karya-arrow');
    list.classList.toggle('open');
    arrow.classList.toggle('open');
  }
</script>

</body>
</html>
