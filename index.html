<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Voxel/Clion</title>
  <link href="stylesheet/loading_mask.css" rel="stylesheet">
  <link href="stylesheet/public_style.css" rel="stylesheet">
  <link href="stylesheet/oreui.css" rel="stylesheet">
  <style>
    .karya-img-wrap {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid #58585A;
      display: block;
    }

    .karya-img-wrap img {
      width: 100%;
      display: block;
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .karya-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s ease;
      pointer-events: none;
    }

    .karya-overlay a {
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: all;
      text-decoration: none;
      box-shadow: none;
    }

    .karya-img-wrap:hover img {
      transform: scale(1.04);
      filter: brightness(0.5);
    }

    .karya-img-wrap:hover .karya-overlay {
      background: rgba(0,0,0,0.3);
    }

    .karya-img-wrap:hover .karya-overlay a {
      opacity: 1;
      transform: scale(1);
    }

    .karya-img-wrap.pressed img {
      transform: scale(1.04);
      filter: brightness(0.5);
    }

    .karya-img-wrap.pressed .karya-overlay {
      background: rgba(0,0,0,0.3);
    }

    .karya-img-wrap.pressed .karya-overlay a {
      opacity: 1;
      transform: scale(1);
    }

    .karya-caption {
      font-family: "NotoSans Bold", sans-serif;
      font-size: 13px;
      color: #D0D1D4;
      padding: 6px 10px;
      background-color: #313233;
      border-top: 2px solid #58585A;
    }

    .karya-item {
      margin: 6px 20px;
    }

    .medsos-btn {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .skills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      justify-content: center;
      padding: 8px 20px;
    }

    /* side drawer for medsos */
    #drawer-overlay {
      background-color: rgba(0,0,0,0.7);
      bottom: 0; left: 0; right: 0; top: 0;
      display: none;
      position: fixed;
      z-index: 11;
    }

    #drawer-overlay.open { display: block; }

    #medsos-drawer {
      background-color: #313233;
      border-right: 2px solid #1E1E1F;
      box-shadow: inset -2px 0 #58585A;
      bottom: 0; left: 0; top: 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      width: 200px;
      z-index: 12;
    }

    #medsos-drawer.open { transform: translateX(0); }

    /* fix header left item clipping */
    .header_item_left {
      width: 50px !important;
    }
    #menu-btn {
      width: 50px !important;
      padding: 0 10px !important;
    }

    #drawer-title {
      align-items: center;
      background-color: #48494A;
      box-shadow: inset 2px 2px rgba(255,255,255,0.2), inset -2px -2px rgba(255,255,255,0.1);
      border-bottom: 4px solid #1E1E1F;
      color: #fff;
      display: flex;
      font-family: "Minecraft Seven", sans-serif;
      font-size: 18px;
      height: 44px;
      justify-content: center;
    }

    #drawer-links {
      padding: 10px 0;
      flex: 1;
    }

    #drawer-links a {
      align-items: center;
      border-bottom: 2px solid #1E1E1F;
      border-top: 2px solid #5A5B5C;
      box-shadow: none;
      color: #fff;
      display: flex;
      font-family: "NotoSans Bold", sans-serif;
      font-size: 15px;
      gap: 10px;
      padding: 12px 20px;
      text-decoration: none;
      transition: background 0.1s;
    }

    #drawer-links a:hover {
      background-color: #48494A;
    }

    #drawer-links a:active {
      background-color: #58585A;
    }

    /* hamburger btn */
    #menu-btn {
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      height: 100%;
      justify-content: center;
      padding: 0 8px;
      width: 42px;
    }

    #menu-btn span {
      background: #333;
      display: block;
      height: 2px;
      width: 20px;
    }

    .footer_info {
      align-items: center;
      color: #FFFFFF;
      display: flex;
      font-family: "Minecraft Seven", sans-serif;
      font-size: 16px;
      height: 60px;
      justify-content: center;
      text-align: center;
      border-top: 2px solid #5A5B5C;
    }

    /* ---- LIGHTBOX ---- */
    #lightbox {
      align-items: center;
      background: rgba(0,0,0,0.92);
      bottom: 0; left: 0; right: 0; top: 0;
      display: none;
      justify-content: center;
      position: fixed;
      z-index: 50;
      padding: 16px;
    }

    #lightbox.open { display: flex; flex-direction: column; }

    #lightbox img {
      border: 2px solid #58585A;
      box-shadow: inset 2px 2px rgba(255,255,255,0.1);
      max-height: 80vh;
      max-width: 100%;
      object-fit: contain;
    }

    #lightbox-caption {
      color: #D0D1D4;
      font-family: "NotoSans Bold", sans-serif;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }

    #lightbox-close {
      position: absolute;
      top: 10px; right: 14px;
      background: #48494A;
      border: 2px solid #1E1E1F;
      box-shadow: inset 0 -3px #333334, inset 2px 2px rgba(255,255,255,0.2);
      color: #fff;
      cursor: pointer;
      font-family: "NotoSans Bold", sans-serif;
      font-size: 16px;
      height: 34px;
      width: 34px;
      display: flex; align-items: center; justify-content: center;
    }

    #lightbox-close:hover { background: #58585A; }
    #lightbox-close:active { background: #333334; box-shadow: none; padding-top: 3px; }

    #lightbox-loading {
      color: #D0D1D4;
      font-family: "Minecraft Seven", sans-serif;
      font-size: 16px;
      position: absolute;
    }
  </style>
</head>

<!-- Loading mask -->
<div class="loading_mask" id="loading_mask">
  <div>
    <div class="spinner"><img alt="" id="spinner_img" src="Loading_white.gif"/></div>
    <div class="spinner">
      <div class="spinner"><span class="spinner_text">Memuat portfolio...</span></div>
    </div>
  </div>
</div>

<!-- Medsos drawer overlay -->
<div id="drawer-overlay" onclick="closeDrawer()"></div>

<!-- Medsos drawer -->
<div id="medsos-drawer">
  <div id="drawer-title">Sosial Media</div>
  <div id="drawer-links">
    <!-- diisi dari config -->
  </div>
</div>

<dispaly-area>
  <header>
    <!-- hamburger kiri -->
    <div class="header_item header_item_left" onclick="openDrawer()">
      <button id="menu-btn">
        <span></span><span></span><span></span>
      </button>
    </div>

    <div class="header_logo">
      <div class="header_title" id="header-nama"></div>
    </div>

    <div class="header_item header_item_blank"></div>
  </header>

  <display-body>
    <scroll-view class="main_scroll_view">
      <scroll-container class="primary_scroll_container">
        <main class="scroll_container" id="main">

          <!-- Title block -->
          <div class="main_title">
            <div class="main_title_area" style="text-align:center; padding: 16px 20px;">
              <div style="font-family:'Minecraft Seven',sans-serif; font-size:26px; margin-bottom:6px;" id="hero-nama"></div>
              <div style="font-family:'NotoSans Bold',sans-serif; font-size:14px; color:#D0D1D4;" id="hero-bio"></div>
            </div>
          </div>

          <!-- Karya -->
          <div class="main main_block">
            <div class="main_block_content" style="width:100%">
              <div style="font-family:'Minecraft Seven',sans-serif; font-size:18px; margin: 4px 0 10px; text-align:center;">Karya</div>
              <div id="karya-list"></div>
            </div>
          </div>

          <!-- Skills -->
          <div class="main main_block">
            <div class="main_block_content" style="width:100%">
              <div style="font-family:'Minecraft Seven',sans-serif; font-size:18px; margin: 4px 0 10px; text-align:center;">Skill</div>
              <div class="skills-row" id="skill-list"></div>
            </div>
          </div>

          <!-- Kontak -->
          <div class="main main_block">
            <div class="main_block_content" style="text-align:center; width:100%">
              <div style="font-family:'Minecraft Seven',sans-serif; font-size:18px; margin: 4px 0 10px;">Kontak</div>
              <div class="btn_group">
                <button class="btn normal_btn small_btn" onclick="window.open(CONFIG.github,'_blank')">GitHub</button>
              </div>
            </div>
          </div>

          <div class="footer_info" id="footer"></div>

        </main>
      </scroll-container>
      <custom-scrollbar class="primary_custom_scrollbar">
        <custom-scrollbar-track></custom-scrollbar-track>
        <custom-scrollbar-thumb></custom-scrollbar-thumb>
      </custom-scrollbar>
    </scroll-view>
  </display-body>
</dispaly-area>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightboxOutside(event)">
  <div id="lightbox-loading">Memuat gambar...</div>
  <img id="lightbox-img" src="" alt="" style="display:none">
  <div id="lightbox-caption"></div>
  <div id="lightbox-close" onclick="closeLightbox()">✕</div>
</div>

</body>

<script src="accessibility.js"></script>
<script>
  // isi dari config
  document.getElementById('header-nama').textContent = CONFIG.nama;
  document.getElementById('hero-nama').textContent = CONFIG.nama;
  document.getElementById('hero-bio').textContent = CONFIG.bio;
  document.getElementById('footer').innerHTML = '&copy; ' + CONFIG.copyright;

  // karya
  const karyaList = document.getElementById('karya-list');
  CONFIG.karya.forEach(function(k, i) {
    karyaList.innerHTML +=
      '<div class="karya-item">' +
        '<div class="karya-img-wrap" onclick="openLightbox(\'' + k.hd + '\', \'' + k.judul + '\')">' +
          '<img src="' + k.preview + '" alt="' + k.judul + '">' +
          '<div class="karya-overlay">' +
            '<button class="btn green_btn extra_small_btn">View</button>' +
          '</div>' +
        '</div>' +
        '<div class="karya-caption">' + k.judul + '</div>' +
      '</div>';
  });

  // skills
  const skillList = document.getElementById('skill-list');
  CONFIG.skills.forEach(function(s) {
    skillList.innerHTML +=
      '<link-block style="width:160px; margin:6px;">' +
        '<div class="link_title"><span class="link_title_text">' + s + '</span></div>' +
      '</link-block>';
  });

  // drawer medsos
  const drawerLinks = document.getElementById('drawer-links');
  CONFIG.medsos.forEach(function(m) {
    drawerLinks.innerHTML +=
      '<a href="' + m.url + '" target="_blank">' +
        '<span style="font-size:18px">' + m.icon + '</span>' +
        m.label +
      '</a>';
  });

  // drawer functions
  function openDrawer() {
    document.getElementById('medsos-drawer').classList.add('open');
    document.getElementById('drawer-overlay').classList.add('open');
  }

  function closeDrawer() {
    document.getElementById('medsos-drawer').classList.remove('open');
    document.getElementById('drawer-overlay').classList.remove('open');
  }

  // touch support karya
  document.addEventListener('touchstart', function(e) {
    var wrap = e.target.closest('.karya-img-wrap');
    document.querySelectorAll('.karya-img-wrap').forEach(el => el.classList.remove('pressed'));
    if (wrap) wrap.classList.add('pressed');
  });

  document.addEventListener('touchend', function(e) {
    setTimeout(function() {
      if (!e.target.closest('.karya-overlay a')) {
        document.querySelectorAll('.karya-img-wrap').forEach(el => el.classList.remove('pressed'));
      }
    }, 800);
  });

  // loading mask
  window.addEventListener('load', function() {
    setTimeout(function() {
      const mask = document.getElementById('loading_mask');
      if (mask) mask.style.display = 'none';
    }, 600);
  });

  // lightbox
  function openLightbox(hdSrc, caption) {
    const lb = document.getElementById('lightbox');
    const img = document.getElementById('lightbox-img');
    const loading = document.getElementById('lightbox-loading');
    const cap = document.getElementById('lightbox-caption');

    img.style.display = 'none';
    loading.style.display = 'block';
    cap.textContent = caption;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';

    const newImg = new Image();
    newImg.onload = function() {
      img.src = hdSrc;
      img.style.display = 'block';
      loading.style.display = 'none';
    };
    newImg.src = hdSrc;
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  function closeLightboxOutside(e) {
    if (e.target === document.getElementById('lightbox')) closeLightbox();
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLightbox();
  });
</script>
