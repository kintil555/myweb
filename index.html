<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 24px, rgba(150,170,210,0.3) 25px),
        repeating-linear-gradient(90deg, transparent, transparent 24px, rgba(150,170,210,0.3) 25px);
      background-size: 25px 25px;
      margin: 0;
      padding: 20px;
    }

    .page {
      max-width: 700px;
      margin: 0 auto;
      background: rgba(255,255,255,0.85);
      padding: 30px;
      border: 1px solid #ccc;
    }

    h1 { font-size: 28px; margin-bottom: 4px; }

    h2 {
      font-size: 18px;
      border-bottom: 1px solid #999;
      padding-bottom: 4px;
      margin-top: 32px;
    }

    p { font-size: 14px; color: #333; line-height: 1.7; }

    .karya-item { margin-top: 14px; }
    .karya-item p { margin: 4px 0 0 0; font-size: 12px; color: #555; }

    .karya-img-wrap {
      position: relative;
      overflow: hidden;
      border: 1px solid #aaa;
      cursor: pointer;
    }

    .karya-img-wrap img {
      width: 100%;
      display: block;
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .karya-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s ease;
      pointer-events: none;
    }

    .karya-overlay a {
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.2s ease, transform 0.2s ease;
      background: white;
      color: #333;
      font-size: 13px;
      padding: 7px 18px;
      border: 1px solid #aaa;
      text-decoration: none;
      pointer-events: all;
    }

    /* hover - desktop */
    .karya-img-wrap:hover img {
      transform: scale(1.04);
      filter: brightness(0.6);
    }

    .karya-img-wrap:hover .karya-overlay {
      background: rgba(0,0,0,0.35);
    }

    .karya-img-wrap:hover .karya-overlay a {
      opacity: 1;
      transform: scale(1);
    }

    /* active - mobile tap */
    .karya-img-wrap.pressed img {
      transform: scale(1.04);
      filter: brightness(0.6);
    }

    .karya-img-wrap.pressed .karya-overlay {
      background: rgba(0,0,0,0.35);
    }

    .karya-img-wrap.pressed .karya-overlay a {
      opacity: 1;
      transform: scale(1);
    }

    .skills { list-style: disc; padding-left: 20px; font-size: 14px; line-height: 2; }

    footer {
      margin-top: 40px;
      border-top: 1px solid #ccc;
      padding-top: 12px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }

    a { color: #0055cc; }

    /* ---- HAMBURGER ---- */
    #menu-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 38px;
      height: 38px;
      background: white;
      border: 1px solid #aaa;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      z-index: 100;
    }

    #menu-btn span {
      display: block;
      width: 20px;
      height: 2px;
      background: #333;
    }

    #menu-dropdown {
      position: fixed;
      top: 58px;
      right: 16px;
      background: white;
      border: 1px solid #aaa;
      min-width: 160px;
      z-index: 99;
      display: none;
    }

    #menu-dropdown.open { display: block; }

    #menu-dropdown a {
      display: block;
      padding: 10px 16px;
      font-size: 14px;
      color: #333;
      text-decoration: none;
      border-bottom: 1px solid #eee;
    }

    #menu-dropdown a:last-child { border-bottom: none; }
    #menu-dropdown a:hover { background: #f5f5f5; }
  </style>
</head>
<body>

<!-- Hamburger menu -->
<div id="menu-btn" onclick="toggleMenu()">
  <span></span><span></span><span></span>
</div>
<div id="menu-dropdown" id="menu-dropdown">
  <!-- diisi otomatis dari config.js -->
</div>

<div class="page">
  <h1 id="nama"></h1>
  <p id="bio"></p>

  <h2>Karya</h2>
  <div id="karya-list"></div>

  <h2>Skill</h2>
  <ul class="skills" id="skill-list"></ul>

  <h2>Kontak</h2>
  <p>GitHub: <a id="github-link" href="" target="_blank"></a></p>

  <footer id="footer"></footer>
</div>

<script src="config.js"></script>
<script>
  // isi konten dari config
  document.getElementById('nama').textContent = CONFIG.nama;
  document.getElementById('bio').textContent = CONFIG.bio;
  document.getElementById('github-link').href = CONFIG.github;
  document.getElementById('github-link').textContent = CONFIG.github.replace('https://', '');
  document.getElementById('footer').innerHTML = '&copy; ' + CONFIG.copyright;

  // karya
  const karyaList = document.getElementById('karya-list');
  CONFIG.karya.forEach(function(k) {
    karyaList.innerHTML +=
      '<div class="karya-item">' +
        '<div class="karya-img-wrap">' +
          '<img src="' + k.gambar + '" alt="' + k.judul + '">' +
          '<div class="karya-overlay">' +
            '<a href="' + k.gambar + '" target="_blank">View</a>' +
          '</div>' +
        '</div>' +
        '<p>' + k.judul + '</p>' +
      '</div>';
  });

  // touch support buat mobile
  document.addEventListener('touchstart', function(e) {
    var wrap = e.target.closest('.karya-img-wrap');
    document.querySelectorAll('.karya-img-wrap').forEach(function(el) {
      el.classList.remove('pressed');
    });
    if (wrap) wrap.classList.add('pressed');
  });

  document.addEventListener('touchend', function(e) {
    setTimeout(function() {
      if (!e.target.closest('.karya-overlay a')) {
        document.querySelectorAll('.karya-img-wrap').forEach(function(el) {
          el.classList.remove('pressed');
        });
      }
    }, 800);
  });

  // skills
  const skillList = document.getElementById('skill-list');
  CONFIG.skills.forEach(function(s) {
    skillList.innerHTML += '<li>' + s + '</li>';
  });

  // medsos di dropdown
  const dropdown = document.getElementById('menu-dropdown');
  CONFIG.medsos.forEach(function(m) {
    dropdown.innerHTML += '<a href="' + m.url + '" target="_blank">' + m.label + '</a>';
  });

  // toggle menu
  function toggleMenu() {
    dropdown.classList.toggle('open');
  }

  // tutup kalau klik di luar
  document.addEventListener('click', function(e) {
    if (!e.target.closest('#menu-btn') && !e.target.closest('#menu-dropdown')) {
      dropdown.classList.remove('open');
    }
  });
</script>

</body>
</html>
